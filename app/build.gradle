plugins {
    id 'com.android.application'
}

android {
    namespace 'com.emeraldwall.puzzle2048'
    compileSdk 34

    defaultConfig {
        applicationId "com.emeraldwall.puzzle2048"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "3.0.0"

        // English only
        resourceConfigurations += ['en']

        // In-app product (one-time, non-consumable) created in Play Console
        buildConfigField 'String', 'REMOVE_ADS_PRODUCT_ID', '"remove_ads"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Google's public sample IDs: safe to click, never earn money.
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'ADMOB_BANNER_UNIT_ID', '"ca-app-pub-3940256099942544/9214589741"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // TODO: replace both with your real AdMob IDs before publishing.
            // Until then the release build also serves test ads.
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'ADMOB_BANNER_UNIT_ID', '"ca-app-pub-3940256099942544/9214589741"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Banner ads + EU/UK consent form
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.0.0'

    // Remove-ads purchase
    implementation 'com.android.billingclient:billing:7.0.0'
}
